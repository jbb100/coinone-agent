# KAIROS-Simple 설정 — 장기 역발상 매집형
# config.example.yaml을 config.yaml로 복사하여 사용하세요.
# 철학: 싸질수록 사고, 비싸질수록 판다. 목업 데이터 금지, 데이터 실패 시 거래 중단.

api:
  coinone:
    api_key: "${COINONE_API_KEY}"
    secret_key: "${COINONE_SECRET_KEY}"
    sandbox: "${COINONE_SANDBOX:true}"
    rate_limit: "${API_RATE_LIMIT_PER_MINUTE:100}"
    timeout: "${API_REQUEST_TIMEOUT:30}"

strategy:
  # 고정 목표 비중 — 시장 상황(강세/약세)에 따라 바꾸지 않는다.
  # 목표에서 이탈하는 것 자체가 매매 신호: 오르면 초과분 매도, 내리면 미달분 매수.
  targets:
    crypto: 0.60
    weights: { BTC: 0.50, ETH: 0.30, XRP: 0.10, SOL: 0.10 }
    # 역발상 틸트: Mayer ratio(현재가/200주MA) 밴드에 따라 목표 비중 조절.
    # <1.0: +10%p(바닥권 매집) | 1-2: 기본 | 2-3: -10%p | >=3: -20%p(과열 익절)
    # 465주 32개 시작점 백테스트에서 고정 목표 대비 전 구간 동등 이상.
    contrarian_tilt: true

  rebalance:
    band_pp: 0.05         # 총 크립토 비중 ±5%p 이탈 시에만 거래 (수수료 대비 충분히 넓게)
    relative_band: 0.20   # 개별 코인 크립토 내 목표 대비 상대 ±20%
    min_trade_krw: 10000

  dca:
    base_amount_krw: 1000000   # 주간 기본 매수액
    max_single_dca_krw: 5000000
    krw_usage_cap: 0.25        # 1회 DCA가 KRW 잔고의 25% 초과 불가

risk:
  max_single_trade_krw: 10000000   # 단일 거래 상한 (1천만원)
  max_daily_volume_krw: 50000000   # 일일 거래량 상한 (5천만원)
  min_krw_ratio: 0.10              # 최소 KRW 비중 (전량 몰빵 방지)
  fomo_surge_threshold: 0.15       # 24h +15% 급등 자산은 DCA 외 매수 금지
  data_max_age_hours: 24           # 데이터 신선도 한도

execution:
  twap_slice_krw: 5000000   # 이 금액 초과 주문은 TWAP 분할
  slippage_cap: 0.005       # 지정가 슬리피지 상한 0.5%
  max_retries: 3

scheduler:
  weekly_dca:     { cron: "0 9 * * 1", timezone: "Asia/Seoul" }   # 매주 월 09:00
  daily_check:    { cron: "0 9 * * *", timezone: "Asia/Seoul" }   # 매일 09:00
  monthly_report: { cron: "0 9 1 * *", timezone: "Asia/Seoul" }   # 매월 1일 09:00

notifications:
  email:
    enabled: false
    smtp_server: "${EMAIL_SMTP_SERVER:smtp.gmail.com}"
    smtp_port: "${EMAIL_SMTP_PORT:587}"
    username: "${EMAIL_USERNAME}"
    password: "${EMAIL_PASSWORD}"
    recipients: ["${EMAIL_TO}"]
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channel: "${SLACK_CHANNEL:#trading-alerts}"
    username: "KAIROS-1"
  alert_levels:
    error: ["email", "slack"]
    warning: ["slack"]
    info: ["slack"]

logging:
  level: "${LOG_LEVEL:INFO}"
  file_path: "./logs/kairos1.log"
  rotation: "100 MB"
  retention: "30 days"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"

database:
  url: "${DATABASE_URL:sqlite:///./data/kairos1.db}"
  backup:
    enabled: true
    interval_hours: 24
    backup_path: "./backups/"
    retention_days: 30

security:
  encryption:
    enabled: true
    key_file: "./config/.encryption_key"
